<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#115e59">
  <title>Stowhive</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%20width=%22512%22%20height=%22512%22%3E%3Crect%20width=%22100%22%20height=%22100%22%20rx=%2222%22%20fill=%22%230f766e%22/%3E%3Cg%20transform=%22translate(50%2050)%20scale(1.12)%20translate(-50%20-50)%22%20stroke=%22%23fff%22%20stroke-width=%223.5%22%20stroke-linejoin=%22round%22%3E%3Cpolygon%20fill=%22rgba(255,255,255,0.35)%22%20points=%2232.68,40%2050,50%2050,70%2032.68,80%2015.36,70%2015.36,50%22/%3E%3Cpolygon%20fill=%22rgba(255,255,255,0.35)%22%20points=%2267.32,40%2084.64,50%2084.64,70%2067.32,80%2050,70%2050,50%22/%3E%3Cpolygon%20fill=%22%23fff%22%20points=%2250,10%2067.32,20%2067.32,40%2050,50%2032.68,40%2032.68,20%22/%3E%3C/g%3E%3Cg%20transform=%22translate(50%2050)%20scale(1.12)%20translate(-50%20-50)%22%3E%3Cpath%20d=%22M41%2030%20L47%2036%20L59%2023%22%20fill=%22none%22%20stroke=%22%230f766e%22%20stroke-width=%225%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3C/g%3E%3C/svg%3E">
  <script>try{var t=localStorage.getItem('stowhive.theme');document.documentElement.dataset.theme=(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Splash screen (removed by app.js; CSS also hides it after a few seconds as a safety net) -->
  <div id="splash" aria-hidden="true">
    <div class="splash-inner">
      <svg class="hex-svg" viewBox="0 0 100 100">
        <polygon class="hex h2" points="32.68,40 50,50 50,70 32.68,80 15.36,70 15.36,50"/>
        <polygon class="hex h3" points="67.32,40 84.64,50 84.64,70 67.32,80 50,70 50,50"/>
        <polygon class="hex h1" points="50,10 67.32,20 67.32,40 50,50 32.68,40 32.68,20"/>
        <path class="hex-tick" d="M41 30 L47 36 L59 23"/>
      </svg>
      <div class="splash-name">Stowhive</div>
      <div class="splash-tag" data-i18n="Keep it. Renew it. Remember it.">Keep it. Renew it. Remember it.</div>
    </div>
  </div>

  <div id="app">
    <!-- Global dashboard -->
    <header class="top">
      <div class="top-bar">
        <h1><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
            <polygon class="bm2" points="32.68,40 50,50 50,70 32.68,80 15.36,70 15.36,50"/>
            <polygon class="bm2" points="67.32,40 84.64,50 84.64,70 67.32,80 50,70 50,50"/>
            <polygon class="bm1" points="50,10 67.32,20 67.32,40 50,50 32.68,40 32.68,20"/>
            <path class="bm-tick" d="M41 30 L47 36 L59 23"/>
          </svg>Stowhive</h1>
        <div class="top-right">
          <span id="today-label"></span>
          <button type="button" class="help-btn lang-btn" data-action="toggle-lang" aria-label="Language" title="Language / 语言"></button>
          <button type="button" class="help-btn" data-action="toggle-theme" aria-label="Toggle dark mode"><span data-ic="moon"></span></button>
          <button type="button" class="help-btn" data-action="account" aria-label="Account and settings" title="Account and settings"><span data-ic="user"></span></button>
        </div>
      </div>
      <div id="summary"></div>
    </header>

    <main>
      <div id="today-tabs" class="subtabs today-tabs" style="display:none">
        <button type="button" class="subtab active" data-action="tab" data-tab="home" data-i18n="Today">Today</button>
        <button type="button" class="subtab" data-action="tab" data-tab="work" data-i18n="Daily Work">Daily Work</button>
      </div>
      <!-- Tab 1: Assets -->
      <!-- Tab 0: Home -->
      <section id="view-home" class="view active">
        <div id="home"></div>
      </section>

      <!-- Tab: Daily Work (things to check every day) -->
      <section id="view-work" class="view">
        <div id="work"></div>
      </section>

      <!-- Tab: Notes (memo) -->
      <section id="view-notes" class="view">
        <div id="notes"></div>
      </section>

      <!-- Tab: Daily budget -->
      <section id="view-budget" class="view">
        <div id="budget"></div>
      </section>

      <!-- Tab 1: Assets -->
      <section id="view-assets" class="view">
        <div id="help-assets"></div>
        <div class="search-wrap">
          <input id="asset-search" type="search" placeholder="Search item name or storage location..." data-i18n-ph="Search item name or storage location...">
        </div>
        <div id="asset-stats"></div>
        <div id="asset-cats" class="chip-row"></div>
        <div id="asset-filters" class="chip-row"></div>
        <div id="asset-list" class="list"></div>
      </section>

      <!-- Tab 2: Renewals -->
      <section id="view-renewals" class="view">
        <div id="help-renewals"></div>
        <div class="subtabs">
          <button class="subtab active" data-action="rtab" data-rtab="subscription" data-i18n="Subscriptions">Subscriptions</button>
          <button class="subtab" data-action="rtab" data-rtab="document" data-i18n="IDs & Renewals">IDs &amp; Renewals</button>
          <button class="subtab" data-action="rtab" data-rtab="paylater" data-i18n="PayLater">PayLater</button>
        </div>
        <div id="quick-wrap" class="quick"></div>
        <div id="renew-stats" class="stats"></div>
        <label class="check inline-check">
          <input type="checkbox" id="show-archived"> <span data-i18n="Show archived / cancelled">Show archived / cancelled</span>
        </label>
        <div class="v-scroll">
          <div id="sub-ana"></div>
          <div id="renew-list" class="list"></div>
        </div>
      </section>
    </main>

    <div class="fab-wrap">
      <button id="fab" class="fab" data-action="fab" aria-label="Add new"><span class="fab-plus">+</span><span class="fab-text">Add Item</span></button>
    </div>

    <nav class="bottom-nav" data-name="Stowhive">
      <button class="nav-btn active" data-action="tab" data-tab="home">
        <span class="nav-ico" data-ic="home"></span><span class="nl" data-i18n="Today">Today</span>
      </button>
      <button class="nav-btn" data-action="tab" data-tab="notes">
        <span class="nav-ico" data-ic="doc"></span><span class="nl" data-i18n="Notes">Notes</span>
      </button>
      <button class="nav-btn" data-action="tab" data-tab="renewals">
        <span class="nav-ico" data-ic="bell"></span><span class="nl" data-i18n="Bills & Dates">Bills &amp; Dates</span>
      </button>
      <button class="nav-btn nav-more-only" data-action="tab" data-tab="assets">
        <span class="nav-ico" data-ic="box"></span><span class="nl" data-i18n="My Items">My Items</span>
      </button>
      <button class="nav-btn nav-more-only" data-action="tab" data-tab="budget">
        <span class="nav-ico" data-ic="wallet"></span><span class="nl" data-i18n="Daily Budget">Daily Budget</span>
      </button>
      <button class="nav-btn nav-more" data-action="more" aria-label="More">
        <span class="nav-ico" data-ic="more"></span><span class="nl" data-i18n="More">More</span>
      </button>
      <button type="button" class="side-acct" data-action="account" aria-label="Account and settings">
        <span class="sa-av" id="sa-av">?</span>
        <span class="sa-tx"><b id="sa-name">Not signed in</b><small id="sa-sub">Tap to sign in and sync</small></span>
        <span class="sa-gear" aria-hidden="true">&#9881;</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="lang.js"></script>
  <script src="ui-kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
